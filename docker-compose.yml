version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: sgip-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sgip_db

  # 2. Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgip-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/sgip_db
      - JWT_SECRET=sgip_production_super_secret_jwt_key_2026
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SMTP_USER=cooperative.team8503@gmail.com
      - SMTP_PASS=smojmmngxobpgpuf
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb

  # 3. Python Streamlit Resume ATS Engine
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: sgip-streamlit
    restart: always
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}

  # 4. React Frontend (Nginx Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgip-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
